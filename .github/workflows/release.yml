name: Publish showcase archives

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: make package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag build.nosync/tilemap.zip build.nosync/aseprite.zip build.nosync/sql.zip build.nosync/nodegraph.zip build.nosync/markov.zip build.nosync/bulletml.zip build.nosync/track.zip build.nosync/SHA256SUMS
